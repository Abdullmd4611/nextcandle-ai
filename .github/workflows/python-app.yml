name: NextCandle AI - Train

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-train:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check Python syntax
        run: |
          python -m py_compile app.py data.py features.py model.py train.py

      - name: Check module imports
        run: |
          python -c "import data; import features; import model; print('All core modules imported successfully.')"

      - name: Check required files
        run: |
          test -f app.py
          test -f data.py
          test -f features.py
          test -f model.py
          test -f train.py
          test -f requirements.txt
          echo "All required project files are present."

      - name: Run NextCandle AI training
        run: |
          python train.py

      - name: Check training outputs
        run: |
          test -f nextcandle_model.joblib
          test -f training_metrics.json
          echo "Training outputs created successfully."

      - name: Upload trained model and metrics
        uses: actions/upload-artifact@v4
        with:
          name: nextcandle-ai-trained-model
          path: |
            nextcandle_model.joblib
            training_metrics.json

      - name: Training completed
        run: |
          echo "NextCandle AI training completed successfully."
